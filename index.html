<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ритм — трекер привычек</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            min-height: 100vh;
        }
        h1 { font-size: 24px; margin-bottom: 20px; }
        .habit-card {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .habit-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
        .habit-stats { font-size: 14px; opacity: 0.7; }
        .add-btn {
            width: 100%;
            padding: 16px;
            background: var(--tg-theme-button-color, #2ea6ff);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Ритм</h1>
    <div id="habits"></div>
    <button class="add-btn" onclick="addHabit()">+ Добавить привычку</button>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Загрузка данных
        let habits = JSON.parse(localStorage.getItem('habits') || '[]');

        function render() {
            const container = document.getElementById('habits');
            if (habits.length === 0) {
                container.innerHTML = '<p style="opacity:0.6">Пока нет привычек. Добавь первую!</p>';
                return;
            }
            container.innerHTML = habits.map((h, i) => `
                <div class="habit-card">
                    <div class="habit-title">${h.name}</div>
                    <div class="habit-stats">Дней: ${h.days} | Серия: ${h.streak}</div>
                </div>
            `).join('');
        }

        function addHabit() {
            const name = prompt('Название привычки:');
            if (!name) return;
            habits.push({ name, days: 0, streak: 0 });
            localStorage.setItem('habits', JSON.stringify(habits));
            render();
        }

        render();
    </script>
</body>
</html>
