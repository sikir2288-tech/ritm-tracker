<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ритм — трекер привычек</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #0f0f14; --card: #1a1a22; --card-2: #23232e;
  --text: #fff; --text-dim: #8a8a99; --accent: #5b8def;
  --green: #34c759; --red: #ff453a; --orange: #ff9f0a;
  --purple: #bf5af2; --blue: #0a84ff; --radius: 18px;
}
body.light {
  --bg: #f2f2f7; --card: #fff; --card-2: #f2f2f7;
  --text: #000; --text-dim: #8e8e93;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  padding-bottom: 100px; overflow-x: hidden;
  transition: background 0.3s, color 0.3s;
  -webkit-overflow-scrolling: touch;
}
.header { padding: 24px 20px 12px; }
.header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
.header .date { color: var(--text-dim); font-size: 14px; margin-top: 4px; text-transform: capitalize; }
.today-ring {
  display: flex; align-items: center; gap: 20px;
  background: var(--card); border-radius: var(--radius);
  padding: 20px; margin: 12px 20px 20px;
}
.ring-progress { transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
.ring-text-wrap {
  position: absolute; display: flex; flex-direction: column;
  align-items: center; justify-content: center; width: 80px; height: 80px;
}
.ring-number { font-size: 22px; font-weight: 700; }
.ring-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
.ring-container { position: relative; display: flex; align-items: center; justify-content: center; }
.ring-info h3 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.ring-info p { font-size: 13px; color: var(--text-dim); }

/* Tasks */
.tasks-section { padding: 0 20px; margin-bottom: 24px; }
.tasks-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.tasks-title { font-size: 13px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
.tasks-count { font-size: 13px; color: var(--text-dim); }
.task-input-row {
  display: flex; gap: 8px; margin-bottom: 10px;
}
.task-input {
  flex: 1; background: var(--card); border: 1px solid transparent;
  color: var(--text); padding: 14px 16px; border-radius: 14px;
  font-size: 15px; outline: none; transition: border 0.2s;
}
.task-input:focus { border-color: var(--accent); }
.task-add-btn {
  background: var(--accent); border: none; color: #fff;
  width: 50px; height: 50px; border-radius: 14px;
  font-size: 24px; font-weight: 600; cursor: pointer;
  flex-shrink: 0; transition: transform 0.15s;
}
.task-add-btn:active { transform: scale(0.92); }
.task-list { display: flex; flex-direction: column; gap: 8px; }
.task-item {
  background: var(--card); border-radius: 14px;
  padding: 14px 16px; display: flex; align-items: center; gap: 12px;
  animation: slideIn 0.3s ease; transition: opacity 0.3s;
}
.task-checkbox {
  width: 24px; height: 24px; border-radius: 8px;
  border: 2px solid var(--card-2); background: transparent;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; transition: all 0.2s;
  color: transparent; font-size: 14px; font-weight: 700;
}
.task-checkbox.checked {
  background: var(--green); border-color: var(--green); color: #fff;
}
.task-text {
  flex: 1; font-size: 15px; transition: all 0.3s;
  word-break: break-word;
}
.task-item.done .task-text {
  color: var(--text-dim); text-decoration: line-through;
}
.task-delete {
  background: none; border: none; color: var(--text-dim);
  font-size: 20px; cursor: pointer; padding: 4px 8px;
  flex-shrink: 0; opacity: 0.5; transition: opacity 0.2s;
}
.task-delete:active { opacity: 1; }

/* Habits */
.habits { padding: 0 20px; }
.habit-card {
  background: var(--card); border-radius: var(--radius);
  padding: 16px; margin-bottom: 12px;
  display: flex; align-items: center; gap: 14px;
  transition: transform 0.2s; animation: slideIn 0.3s ease;
}
@keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.habit-card:active { transform: scale(0.98); }
.habit-icon {
  width: 46px; height: 46px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}
.habit-body { flex: 1; min-width: 0; }
.habit-title { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
.habit-sub { font-size: 13px; color: var(--text-dim); }
.habit-action {
  background: var(--card-2); border: none; color: var(--text);
  width: 44px; height: 44px; border-radius: 12px;
  font-size: 20px; font-weight: 600; cursor: pointer;
  flex-shrink: 0; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.habit-action:active { transform: scale(0.9); }
.habit-action.done { background: var(--green); color: #fff; }
.habit-action.plus { font-size: 22px; }
.empty { text-align: center; padding: 30px 20px; color: var(--text-dim); font-size: 15px; }
.empty-icon { font-size: 42px; margin-bottom: 10px; opacity: 0.5; }

/* Nav */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(26,26,34,0.95);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid rgba(255,255,255,0.06);
  display: flex; padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
  z-index: 100;
}
body.light .nav { background: rgba(255,255,255,0.95); border-top: 1px solid rgba(0,0,0,0.06); }
.nav-item {
  flex: 1; background: none; border: none; color: var(--text-dim);
  font-size: 11px; padding: 8px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  transition: color 0.2s;
}
.nav-item.active { color: var(--accent); }
.nav-icon { font-size: 22px; }
.nav-add .nav-icon {
  background: var(--accent); color: #fff;
  width: 38px; height: 38px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 600;
}

/* Screens */
.screen { display: none; }
.screen.active { display: block; }
.stats { padding: 0 20px; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.stat-card { background: var(--card); border-radius: var(--radius); padding: 16px; animation: slideIn 0.3s ease; }
.stat-card.wide { grid-column: span 2; }
.stat-label { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.stat-value { font-size: 22px; font-weight: 700; }
.stat-value.positive { color: var(--green); }
.stat-value.negative { color: var(--red); }
.stat-value.accent { color: var(--accent); }
.stat-sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
.section-title {
  font-size: 13px; color: var(--text-dim); text-transform: uppercase;
  letter-spacing: 1px; margin: 24px 0 12px;
}
.heatmap { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; overflow-x: auto; }
.heatmap-grid { display: grid; grid-template-rows: repeat(7, 12px); grid-auto-flow: column; gap: 3px; }
.heat-cell { width: 12px; height: 12px; border-radius: 3px; background: var(--card-2); }
.heat-cell.l1 { background: rgba(91,141,239,0.3); }
.heat-cell.l2 { background: rgba(91,141,239,0.55); }
.heat-cell.l3 { background: rgba(91,141,239,0.8); }
.heat-cell.l4 { background: #5b8def; }

/* Books */
.book-item {
  background: var(--card-2); border-radius: 14px; padding: 14px;
  margin-bottom: 8px; display: flex; align-items: center; gap: 12px;
}
.book-cover {
  width: 36px; height: 48px; border-radius: 6px;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.book-title { font-size: 14px; font-weight: 600; }
.book-status { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.book-btn {
  margin-left: auto; background: var(--card); border: none;
  color: var(--accent); padding: 8px 12px; border-radius: 10px;
  font-size: 12px; font-weight: 600; cursor: pointer;
}
.book-btn:active { transform: scale(0.95); }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  z-index: 200; display: none; align-items: flex-end;
  animation: fadeIn 0.2s;
}
.modal-overlay.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--card); width: 100%;
  border-radius: 24px 24px 0 0;
  padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
  animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  max-height: 90vh; overflow-y: auto;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.modal .sub { font-size: 13px; color: var(--text-dim); margin-bottom: 20px; }
.modal-input {
  width: 100%; background: var(--card-2);
  border: 1px solid rgba(255,255,255,0.06); color: var(--text);
  padding: 16px; border-radius: 14px; font-size: 16px;
  margin-bottom: 12px; outline: none;
}
body.light .modal-input { border: 1px solid rgba(0,0,0,0.08); }
.modal-input:focus { border-color: var(--accent); }
.type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.type-btn {
  background: var(--card-2); border: 2px solid transparent; color: var(--text);
  padding: 14px; border-radius: 14px; font-size: 13px; cursor: pointer;
  text-align: left; transition: all 0.2s;
}
.type-btn.selected { border-color: var(--accent); background: rgba(91,141,239,0.1); }
.type-btn .emoji { font-size: 20px; display: block; margin-bottom: 4px; }
.type-btn .label { font-weight: 600; }
.btn {
  width: 100%; background: var(--accent); border: none; color: #fff;
  padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 600;
  cursor: pointer; margin-top: 8px; transition: transform 0.2s;
}
.btn:active { transform: scale(0.98); }
.btn.secondary { background: var(--card-2); color: var(--text); }
.btn.danger { background: rgba(255,69,58,0.15); color: var(--red); }
.toast {
  position: fixed; top: 20px; left: 50%;
  transform: translateX(-50%) translateY(-100px);
  background: var(--card-2); color: var(--text);
  padding: 12px 20px; border-radius: 14px;
  font-size: 14px; font-weight: 600; z-index: 300;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="screen active" id="todayScreen">
  <div class="header">
    <h1 id="greeting">Привет!</h1>
    <div class="date" id="dateLabel"></div>
  </div>

  <div class="today-ring">
    <div class="ring-container">
      <svg width="80" height="80" viewBox="0 0 80 80">
        <circle cx="40" cy="40" r="34" stroke="rgba(255,255,255,0.08)" stroke-width="7" fill="none"/>
        <circle class="ring-progress" cx="40" cy="40" r="34" stroke="#5b8def" stroke-width="7" fill="none"
                stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6"
                transform="rotate(-90 40 40)"/>
      </svg>
      <div class="ring-text-wrap">
        <div class="ring-number" id="ringNumber">0</div>
        <div class="ring-label">из <span id="ringTotal">0</span></div>
      </div>
    </div>
    <div class="ring-info">
      <h3>Прогресс дня</h3>
      <p id="ringHint">Отмечай привычки и задачи</p>
    </div>
  </div>

  <div class="tasks-section">
    <div class="tasks-header">
      <div class="tasks-title">Задачи на сегодня</div>
      <div class="tasks-count" id="tasksCount"></div>
    </div>
    <div class="task-input-row">
      <input class="task-input" id="taskInput" placeholder="Что нужно сделать?" maxlength="120">
      <button class="task-add-btn" onclick="addTask()">+</button>
    </div>
    <div class="task-list" id="taskList"></div>
  </div>

  <div class="habits" id="habitsList"></div>
</div>

<div class="screen" id="statsScreen">
  <div class="header">
    <h1>Статистика</h1>
    <div class="date">Все итоги за всё время</div>
  </div>
  <div class="stats" id="statsContent"></div>
</div>

<nav class="nav">
  <button class="nav-item active" data-screen="today" onclick="switchScreen('today')">
    <span class="nav-icon">🏠</span><span>Сегодня</span>
  </button>
  <button class="nav-item nav-add" onclick="openAddModal()">
    <span class="nav-icon">+</span><span>Добавить</span>
  </button>
  <button class="nav-item" data-screen="stats" onclick="switchScreen('stats')">
    <span class="nav-icon">📊</span><span>Статистика</span>
  </button>
</nav>

<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div id="modalContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor?.('#0f0f14'); tg.setBackgroundColor?.('#0f0f14'); }
if (tg?.colorScheme === 'light' || (!tg && window.matchMedia('(prefers-color-scheme: light)').matches)) {
  document.body.classList.add('light');
}

const STORAGE_KEY = 'ritm_tracker_v3';
let state = load();

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { habits: [], books: [], tasks: [], initialized: false };
}
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function todayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function formatMoney(n) { return new Intl.NumberFormat('ru-RU').format(Math.round(n)) + ' ₽'; }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}
function haptic(type) {
  if (!tg?.HapticFeedback) return;
  try {
    if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
    else tg.HapticFeedback.impactOccurred('light');
  } catch(e) {}
}

const CATEGORIES = {
  income:  { label: 'Доход',       icon: '💰', type: 'money',  bg: 'rgba(52,199,89,0.15)' },
  expense: { label: 'Расход',      icon: '💸', type: 'money',  bg: 'rgba(255,69,58,0.15)' },
  savings: { label: 'Отложено',    icon: '🏦', type: 'money',  bg: 'rgba(91,141,239,0.15)' },
  workout: { label: 'Тренировка',  icon: '💪', type: 'check',  bg: 'rgba(255,159,10,0.15)' },
  english: { label: 'Английский',  icon: '🇬🇧', type: 'check',  bg: 'rgba(10,132,255,0.15)' },
  skill:   { label: 'Новый навык', icon: '🧠', type: 'check',  bg: 'rgba(191,90,242,0.15)' },
  reading: { label: 'Чтение',      icon: '📖', type: 'number', bg: 'rgba(10,132,255,0.15)' },
  books:   { label: 'Книги',       icon: '📚', type: 'books',  bg: 'rgba(191,90,242,0.15)' },
};

function uid() { return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }

function initDefaults() {
  if (state.initialized) return;
  const defaults = ['income', 'expense', 'savings', 'workout', 'english', 'skill', 'reading', 'books'];
  state.habits = defaults.map(key => ({
    id: uid(),
    name: CATEGORIES[key].label,
    category: key,
    unit: key === 'reading' ? 'стр.' : '',
    entries: []
  }));
  state.initialized = true;
  save();
}

function getEntries(h) { if (!h.entries) h.entries = []; return h.entries; }
function hasToday(h) { return getEntries(h).some(e => e.date === todayKey()); }
function getTodayValue(h) { const e = getEntries(h).find(e => e.date === todayKey()); return e ? e.value : null; }
function getTotal(h) { return getEntries(h).reduce((s,e) => s + (typeof e.value === 'number' ? e.value : 1), 0); }
function getDaysCount(h) { return getEntries(h).length; }
function getStreak(h) {
  const entries = getEntries(h).slice().sort((a,b) => b.date.localeCompare(a.date));
  if (!entries.length) return 0;
  const dates = new Set(entries.map(e => e.date));
  let streak = 0;
  let d = new Date();
  if (!dates.has(todayKey())) d.setDate(d.getDate() - 1);
  let guard = 0;
  while (guard++ < 3650) {
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    if (dates.has(key)) { streak++; d.setDate(d.getDate() - 1); } else break;
  }
  return streak;
}
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// === TASKS ===
function getTodayTasks() {
  return state.tasks.filter(t => t.date === todayKey());
}
function renderTasks() {
  const tasks = getTodayTasks();
  const list = document.getElementById('taskList');
  const counter = document.getElementById('tasksCount');
  const done = tasks.filter(t => t.done).length;
  if (tasks.length === 0) {
    list.innerHTML = '<div class="empty" style="padding:16px 0;font-size:13px">Нет задач на сегодня. Добавь первую ↓</div>';
    counter.textContent = '';
  } else {
    list.innerHTML = tasks.map(t =>
      '<div class="task-item ' + (t.done ? 'done' : '') + '">' +
        '<div class="task-checkbox ' + (t.done ? 'checked' : '') + '" onclick="toggleTask(\'' + t.id + '\')">' + (t.done ? '✓' : '') + '</div>' +
        '<div class="task-text">' + escapeHtml(t.text) + '</div>' +
        '<button class="task-delete" onclick="deleteTask(\'' + t.id + '\')">×</button>' +
      '</div>'
    ).join('');
    counter.textContent = done + ' / ' + tasks.length;
  }
  updateRing();
}
function addTask() {
  const inp = document.getElementById('taskInput');
  const text = inp.value.trim();
  if (!text) return;
  state.tasks.push({ id: uid(), text: text, date: todayKey(), done: false, created: Date.now() });
  inp.value = '';
  save(); haptic('success'); renderTasks();
}
function toggleTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  t.done = !t.done;
  if (t.done) { t.doneAt = todayKey(); haptic('success'); } else { delete t.doneAt; haptic('light'); }
  save(); renderTasks();
}
function deleteTask(id) {
  state.tasks = state.tasks.filter(x => x.id !== id);
  save(); renderTasks();
}

// === HABITS ===
function renderToday() {
  const list = document.getElementById('habitsList');
  if (!state.habits.length) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">✨</div><div>Пока нет привычек</div></div>';
    updateRing();
    return;
  }
  list.innerHTML = state.habits.map(h => {
    const cat = CATEGORIES[h.category] || CATEGORIES.skill;
    const done = hasToday(h);
    const todayVal = getTodayValue(h);
    const total = getTotal(h);
    const streak = getStreak(h);
    const days = getDaysCount(h);
    let sub = '', actionHtml = '';

    if (h.category === 'books') {
      const read = state.books.filter(b => b.status === 'read').length;
      const reading = state.books.filter(b => b.status === 'reading').length;
      sub = 'Прочитано: ' + read + ' · Читаю: ' + reading;
      actionHtml = '<button class="habit-action plus" onclick="openBooksModal()">📚</button>';
    } else if (cat.type === 'money') {
      sub = 'Всего: ' + formatMoney(total) + (days ? ' · ' + days + ' дн.' : '');
      if (todayVal !== null) sub = 'Сегодня: ' + formatMoney(todayVal) + ' · Всего: ' + formatMoney(total);
      actionHtml = '<button class="habit-action ' + (todayVal !== null ? 'done' : 'plus') + '" onclick="addMoney(\'' + h.id + '\')">' + (todayVal !== null ? '✓' : '+') + '</button>';
    } else if (cat.type === 'check') {
      sub = done ? '🔥 ' + streak + ' ' + plural(streak,'день','дня','дней') + ' подряд · Всего: ' + days : (days ? 'Отмечено: ' + days + ' ' + plural(days,'день','дня','дней') : 'Ещё не отмечено');
      actionHtml = '<button class="habit-action ' + (done ? 'done' : '') + '" onclick="toggleCheck(\'' + h.id + '\')">' + (done ? '✓' : '') + '</button>';
    } else if (cat.type === 'number') {
      sub = todayVal !== null ? 'Сегодня: ' + todayVal + ' ' + (h.unit || '') + ' · Всего: ' + total : 'Всего: ' + total + ' ' + (h.unit || '');
      actionHtml = '<button class="habit-action plus" onclick="addNumber(\'' + h.id + '\')">+</button>';
    }

    return '<div class="habit-card">' +
      '<div class="habit-icon" style="background:' + cat.bg + '">' + cat.icon + '</div>' +
      '<div class="habit-body">' +
        '<div class="habit-title">' + escapeHtml(h.name) + '</div>' +
        '<div class="habit-sub">' + sub + '</div>' +
      '</div>' + actionHtml + '</div>';
  }).join('');
  updateRing();
}

function updateRing() {
  const total = state.habits.length;
  const done = state.habits.filter(h => {
    const cat = CATEGORIES[h.category];
    if (!cat || cat.type === 'books') return false;
    if (cat.type === 'money' || cat.type === 'number') return getTodayValue(h) !== null;
    if (cat.type === 'check') return hasToday(h);
    return false;
  }).length;
  const pct = total ? done / total : 0;
  const ring = document.querySelector('.ring-progress');
  if (ring) ring.style.strokeDashoffset = 213.6 * (1 - pct);
  document.getElementById('ringNumber').textContent = done;
  document.getElementById('ringTotal').textContent = total;
  const hint = document.getElementById('ringHint');
  if (total === 0) hint.textContent = 'Добавь первую привычку →';
  else if (pct === 1) hint.textContent = '🎉 Всё выполнено!';
  else if (pct >= 0.5) hint.textContent = 'Хороший темп, продолжай!';
  else hint.textContent = 'Начни отмечать выполнение';
}

// === STATS ===
function renderStats() {
  const c = document.getElementById('statsContent');
  if (!state.habits.length) {
    c.innerHTML = '<div class="empty"><div class="empty-icon">📊</div><div>Нет данных</div></div>';
    return;
  }
  const sumBy = cat => state.habits.filter(h => h.category === cat).reduce((s,h) => s + getTotal(h), 0);
  const daysBy = cat => state.habits.filter(h => h.category === cat).reduce((s,h) => s + getDaysCount(h), 0);
  const incomes = sumBy('income');
  const expenses = sumBy('expense');
  const savings = sumBy('savings');
  const workouts = daysBy('workout');
  const english = daysBy('english');
  const skills = daysBy('skill');
  const pages = sumBy('reading');
  const booksRead = state.books.filter(b => b.status === 'read').length;
  const tasksDoneAll = state.tasks.filter(t => t.done).length;

  let html = '';
  html += '<div class="section-title">Задачи</div><div class="stat-grid">';
  html += '<div class="stat-card wide"><div class="stat-label">Выполнено задач за всё время</div><div class="stat-value accent">' + tasksDoneAll + '</div></div>';
  html += '</div>';

  if (incomes || expenses || savings) {
    html += '<div class="section-title">Финансы</div><div class="stat-grid">';
    if (incomes) html += '<div class="stat-card"><div class="stat-label">Всего заработано</div><div class="stat-value positive">' + formatMoney(incomes) + '</div></div>';
    if (expenses) html += '<div class="stat-card"><div class="stat-label">Всего потрачено</div><div class="stat-value negative">' + formatMoney(expenses) + '</div></div>';
    if (savings) html += '<div class="stat-card wide"><div class="stat-label">Всего отложено</div><div class="stat-value accent">' + formatMoney(savings) + '</div></div>';
    html += '</div>';
  }

  if (workouts || english || skills) {
    html += '<div class="section-title">Привычки-действия</div><div class="stat-grid">';
    if (workouts) html += '<div class="stat-card"><div class="stat-label">Тренировок</div><div class="stat-value">' + workouts + '</div><div class="stat-sub">' + plural(workouts,'день','дня','дней') + '</div></div>';
    if (english) html += '<div class="stat-card"><div class="stat-label">Английский</div><div class="stat-value">' + english + '</div><div class="stat-sub">' + plural(english,'день','дня','дней') + '</div></div>';
    if (skills) html += '<div class="stat-card wide"><div class="stat-label">Новые навыки</div><div class="stat-value">' + skills + '</div><div class="stat-sub">' + plural(skills,'день','дня','дней') + ' практики</div></div>';
    html += '</div>';
  }

  if (pages || booksRead) {
    html += '<div class="section-title">Чтение</div><div class="stat-grid">';
    if (pages) html += '<div class="stat-card wide"><div class="stat-label">Всего прочитано страниц</div><div class="stat-value">' + pages + '</div></div>';
    if (booksRead) html += '<div class="stat-card wide"><div class="stat-label">Прочитано книг</div><div class="stat-value">' + booksRead + '</div></div>';
    html += '</div>';
  }

  const active = state.habits.filter(h => h.category !== 'books');
  if (active.length) {
    html += '<div class="section-title">Тепловая карта за 3 месяца</div><div class="heatmap"><div class="heatmap-grid">';
    const dayCounts = {};
    state.habits.forEach(h => getEntries(h).forEach(e => { dayCounts[e.date] = (dayCounts[e.date] || 0) + 1; }));
    state.tasks.forEach(t => { if (t.done && t.doneAt) dayCounts[t.doneAt] = (dayCounts[t.doneAt] || 0) + 1; });
    const today = new Date();
    const start = new Date(today);
    start.setDate(start.getDate() - 89);
    for (let i = 0; i < 91; i++) {
      const d = new Date(start);
      d.setDate(d.getDate() + i);
      const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
      const count = dayCounts[key] || 0;
      const pct = active.length ? count / active.length : 0;
      let lvl = '';
      if (pct > 0 && pct < 0.25) lvl = 'l1';
      else if (pct < 0.5) lvl = 'l2';
      else if (pct < 0.75) lvl = 'l3';
      else if (pct >= 0.75) lvl = 'l4';
      html += '<div class="heat-cell ' + lvl + '" title="' + key + ': ' + count + '"></div>';
    }
    html += '</div></div>';
  }

  c.innerHTML = html;
}

// === HABIT ACTIONS ===
function toggleCheck(id) {
  const h = state.habits.find(x => x.id === id);
  if (!h) return;
  if (!h.entries) h.entries = [];
  const idx = h.entries.findIndex(e => e.date === todayKey());
  if (idx >= 0) h.entries.splice(idx, 1);
  else h.entries.push({ date: todayKey(), value: true });
  save(); haptic('success'); renderToday();
}

function addMoney(id) {
  const h = state.habits.find(x => x.id === id);
  if (!h) return;
  const existing = getTodayValue(h);
  document.getElementById('modalContent').innerHTML =
    '<h2>' + CATEGORIES[h.category].label + '</h2>' +
    '<div class="sub">' + (existing ? 'Сегодня уже: ' + formatMoney(existing) : 'Введи сумму в рублях') + '</div>' +
    '<input class="modal-input" id="moneyInput" type="number" inputmode="numeric" placeholder="0">' +
    '<button class="btn" onclick="saveMoney(\'' + id + '\')">' + (existing ? 'Добавить ещё' : 'Сохранить') + '</button>' +
    (existing ? '<button class="btn danger" onclick="deleteToday(\'' + id + '\')" style="margin-top:8px">Обнулить за сегодня</button>' : '') +
    '<button class="btn secondary" onclick="closeModal()" style="margin-top:8px">Отмена</button>';
  document.getElementById('modal').classList.add('active');
  setTimeout(() => document.getElementById('moneyInput')?.focus(), 200);
}
function saveMoney(id) {
  const val = parseFloat(document.getElementById('moneyInput').value);
  if (isNaN(val) || val <= 0) { toast('Введи сумму > 0'); return; }
  const h = state.habits.find(x => x.id === id);
  if (!h.entries) h.entries = [];
  const idx = h.entries.findIndex(e => e.date === todayKey());
  if (idx >= 0) h.entries[idx].value = (h.entries[idx].value || 0) + val;
  else h.entries.push({ date: todayKey(), value: val });
  save(); haptic('success'); closeModal(); renderToday();
  toast('+' + formatMoney(val));
}

function addNumber(id) {
  const h = state.habits.find(x => x.id === id);
  if (!h) return;
  const existing = getTodayValue(h);
  document.getElementById('modalContent').innerHTML =
    '<h2>' + escapeHtml(h.name) + '</h2>' +
    '<div class="sub">' + (existing ? 'Сегодня уже: ' + existing + ' ' + (h.unit || '') : 'Введи количество') + '</div>' +
    '<input class="modal-input" id="numInput" type="number" inputmode="numeric" placeholder="0">' +
    '<button class="btn" onclick="saveNumber(\'' + id + '\')">' + (existing ? 'Добавить ещё' : 'Сохранить') + '</button>' +
    '<button class="btn secondary" onclick="closeModal()" style="margin-top:8px">Отмена</button>';
  document.getElementById('modal').classList.add('active');
  setTimeout(() => document.getElementById('numInput')?.focus(), 200);
}
function saveNumber(id) {
  const val = parseFloat(document.getElementById('numInput').value);
  if (isNaN(val) || val <= 0) { toast('Введи число > 0'); return; }
  const h = state.habits.find(x => x.id === id);
  if (!h.entries) h.entries = [];
  const idx = h.entries.findIndex(e => e.date === todayKey());
  if (idx >= 0) h.entries[idx].value = (h.entries[idx].value || 0) + val;
  else h.entries.push({ date: todayKey(), value: val });
  save(); haptic('success'); closeModal(); renderToday();
  toast('+' + val + ' ' + (h.unit || ''));
}

function deleteToday(id) {
  const h = state.habits.find(x => x.id === id);
  if (!h) return;
  h.entries = (h.entries || []).filter(e => e.date !== todayKey());
  save(); closeModal(); renderToday(); toast('Обнулено');
}

// === ADD HABIT MODAL ===
let selectedType = null;
function openAddModal() {
  selectedType = null;
  renderAddModal();
  document.getElementById('modal').classList.add('active');
}
function selectType(key) { selectedType = key; renderAddModal(); }
function renderAddModal() {
  const types = [
    { key: 'income',  label: 'Доход',       emoji: '💰' },
    { key: 'expense', label: 'Расход',      emoji: '💸' },
    { key: 'savings', label: 'Отложено',    emoji: '🏦' },
    { key: 'workout', label: 'Тренировка',  emoji: '💪' },
    { key: 'english', label: 'Английский',  emoji: '🇬🇧' },
    { key: 'skill',   label: 'Новый навык', emoji: '🧠' },
    { key: 'reading', label: 'Чтение',      emoji: '📖' },
    { key: 'books',   label: 'Книги',       emoji: '📚' }
  ];
  const cat = selectedType ? CATEGORIES[selectedType] : null;
  let html = '<h2>Новая привычка</h2><div class="sub">Выбери тип</div><div class="type-grid">';
  html += types.map(t => '<button class="type-btn ' + (selectedType===t.key?'selected':'') + '" onclick="selectType(\'' + t.key + '\')"><span class="emoji">' + t.emoji + '</span><span class="label">' + t.label + '</span></button>').join('');
  html += '</div>';
  if (selectedType) {
    html += '<input class="modal-input" id="habitName" placeholder="Название" value="' + cat.label + '">';
    if (selectedType === 'reading') html += '<input class="modal-input" id="habitUnit" placeholder="Единица" value="стр.">';
    html += '<button class="btn" onclick="saveHabit()">Добавить</button>';
  }
  html += '<button class="btn secondary" onclick="closeModal()" style="margin-top:8px">Отмена</button>';
  document.getElementById('modalContent').innerHTML = html;
  setTimeout(() => document.getElementById('habitName')?.focus(), 200);
}
function saveHabit() {
  if (!selectedType) { toast('Выбери тип'); return; }
  const name = (document.getElementById('habitName')?.value || '').trim() || CATEGORIES[selectedType].label;
  const unit = (document.getElementById('habitUnit')?.value || '').trim();
  state.habits.push({ id: uid(), name: name, category: selectedType, unit: unit, entries: [] });
  save(); haptic('success'); closeModal(); renderToday();
  toast('Привычка добавлена');
}

// === BOOKS ===
function openBooksModal() {
  renderBooksModal();
  document.getElementById('modal').classList.add('active');
}
function renderBooksModal() {
  const books = state.books;
  const readCount = books.filter(b => b.status === 'read').length;
  const readingCount = books.filter(b => b.status === 'reading').length;
  let html = '<h2>📚 Книги</h2>';
  html += '<div class="sub">Прочитано: ' + readCount + ' · Читаю: ' + readingCount + '</div>';
  html += '<input class="modal-input" id="bookInput" placeholder="Название книги">';
  html += '<button class="btn" onclick="addBook()">Добавить в «Читаю»</button>';
  html += '<div style="margin-top:20px">';
  if (books.length) {
    html += books.map((b, i) => {
      const btn = b.status === 'reading'
        ? '<button class="book-btn" onclick="finishBook(' + i + ')">Прочитал</button>'
        : '<button class="book-btn" onclick="deleteBook(' + i + ')" style="color:var(--red)">Удалить</button>';
      return '<div class="book-item"><div class="book-cover">' + (b.status === 'read' ? '✓' : '📖') + '</div><div><div class="book-title">' + escapeHtml(b.title) + '</div><div class="book-status">' + (b.status === 'read' ? 'Прочитано' : 'Читаю') + '</div></div>' + btn + '</div>';
    }).join('');
  } else {
    html += '<div class="empty" style="padding:20px 0">Пока нет книг</div>';
  }
  html += '</div>';
  html += '<button class="btn secondary" onclick="closeModal()" style="margin-top:12px">Закрыть</button>';
  document.getElementById('modalContent').innerHTML = html;
  setTimeout(() => document.getElementById('bookInput')?.focus(), 200);
}
function addBook() {
  const title = (document.getElementById('bookInput')?.value || '').trim();
  if (!title) { toast('Введи название'); return; }
  state.books.push({ title: title, status: 'reading', added: todayKey() });
  save(); haptic('success'); renderBooksModal(); renderToday();
}
function finishBook(i) {
  state.books[i].status = 'read';
  state.books[i].finished = todayKey();
  save(); haptic('success'); renderBooksModal(); renderToday();
  toast('Книга прочитана! 🎉');
}
function deleteBook(i) {
  state.books.splice(i, 1);
  save(); renderBooksModal(); renderToday();
}

// === NAVIGATION ===
function switchScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(name + 'Screen').classList.add('active');
  document.querySelectorAll('.nav-item[data-screen]').forEach(n => n.classList.toggle('active', n.dataset.screen === name));
  if (name === 'stats') renderStats();
  else renderToday();
  haptic('light');
  window.scrollTo(0, 0);
}

function closeModal(e) {
  if (e && e.target && e.target.id !== 'modal') return;
  document.getElementById('modal').classList.remove('active');
}

// === INIT ===
const dateLabel = document.getElementById('dateLabel');
if (dateLabel) dateLabel.textContent = new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
const hour = new Date().getHours();
let greet = 'Привет!';
if (hour < 6) greet = 'Доброй ночи';
else if (hour < 12) greet = 'Доброе утро';
else if (hour < 18) greet = 'Добрый день';
else greet = 'Добрый вечер';
document.getElementById('greeting').textContent = greet;

// Enter для добавления задачи
document.getElementById('taskInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); addTask(); }
});

initDefaults();
renderTasks();
renderToday();
</script>
